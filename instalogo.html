<!DOCTYPE html>
<html>
<head>
    <title>Instagram Logo</title>

    <style>

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .instagram{
            width:400px;
            height:400px;
            border-radius:80px;
            position:relative;

            background: radial-gradient(
                circle at 70% 110%,
                #ffd600 0%,
                #ffb000 20%,
                #ff6a00 35%,
                #ff0069 55%,
                #ff00c8 75%,
                #b000ff 90%,
                #5a00ff 100%
            );
            
        }

        .camera{
            width:240px;
            height:240px;
            border:18px solid white;
            border-radius:60px;

            position:absolute;
            top:60px;
            left:60px;
        }

        .lens{
            width:90px;
            height:90px;
            border:18px solid white;
            border-radius:50%;

            position:absolute;
            top:55px;
            left:55px;
        }

        .flash{
            width:30px;
            height:30px;
            background:white;
            border-radius:50%;

            position:absolute;
            top:35px;
            right:35px;
        }

    </style>

</head>

<body>

<div class="instagram">

    <div class="camera">

        <div class="lens"></div>

        <div class="flash"></div>

    </div>

</div>

</body>
</html>
